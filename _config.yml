title: "Andrea Guerrieri – Theoretical Physicist"
description: "Lecturer and Royal Society University Research Fellow at City St George's, University of London. Research in S-matrix bootstrap, QCD, scattering amplitudes, and quantum gravity."
author: "Andrea Guerrieri"

lang: en

social:
  name: "Andrea Guerrieri"
  links:
    - "https://andreaguerr.github.io"
    - "https://www.citystgeorges.ac.uk/about/people/academics/andrea-guerrieri"
    - "https://inspirehep.net/authors/1275267"
    - "https://scholar.google.com/citations?user=f8-gtH0AAAAJ"
    - "https://www.linkedin.com/in/andrea-guerrieri-03a1678a"
    - "https://x.com/GuerrieriPhys"


theme: jekyll-theme-minimal

logo: /assets/images/foto_city.jpeg

# Where the site actually lives
url: "https://andreaguerr.github.io"
baseurl: ""   # keep empty for a user site like username.github.io

# Markdown & math configuration
markdown: kramdown
kramdown:
  input: GFM            # GitHub-Flavored Markdown (tables, fenced code blocks, etc.)
  math_engine: mathjax  # enable MathJax processing
  parse_block_html: true
  hard_wrap: false
  syntax_highlighter: rouge

highlighter: rouge

# Optional metadata GitHub can use in places
github_username: andreaguerr

# Files that should not be part of the generated site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
